name: Reconstruir aplicación

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verificar bloques
        shell: bash
        run: |
          set -euo pipefail
          count=$(find payload -maxdepth 1 -type f -name 'part*.txt' | wc -l | tr -d ' ')
          echo "Bloques encontrados: $count"
          test "$count" = "18"
          wc -c payload/part*.txt

      - name: Reconstruir index.html original
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part*.txt \
            | tr -d '\r\n\t ' \
            | base64 --decode \
            | gzip -dc \
            > index.html

          bytes=$(wc -c < index.html | tr -d ' ')
          echo "index.html reconstruido: $bytes bytes"
          sha256sum index.html

          test "$bytes" = "1158506"
          grep -q "Arma la salida" index.html
          grep -qi "<!doctype html>" index.html
          echo "Comprobación de integridad: OK"

      - name: Publicar HTML directo en main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "index.html ya está actualizado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publicar aplicación como HTML directo"
          git push origin HEAD:main
