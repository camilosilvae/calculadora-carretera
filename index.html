<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculadora de recorridos y peajes</title>
<style>
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#eae7e1;color:#141311;display:grid;min-height:100vh;place-items:center}
main{max-width:600px;padding:32px;text-align:center}
h1{font-size:28px;margin:0 0 10px}
p{line-height:1.5;margin:8px 0}.detalle{font-size:13px;color:#666;word-break:break-word}
</style>
</head>
<body>
<main><h1>Cargando aplicación…</h1><p>Preparando la calculadora de recorridos y peajes.</p><p class="detalle" id="detalle"></p></main>
<script>
(async()=>{
  const detalle=document.getElementById("detalle");
  try{
    const version="20260807-3";
    const names=Array.from({length:18},(_,i)=>`part${String(i+1).padStart(2,"0")}.txt`);
    const chunks=[];
    let total=0;

    async function descargarBloque(name,index){
      const fuentes=[
        `payload/${name}?v=${version}`,
        `https://raw.githubusercontent.com/camilosilvae/calculadora-carretera/main/payload/${name}?v=${version}`
      ];
      let ultimoError=null;
      for(const url of fuentes){
        try{
          detalle.textContent=`Cargando datos ${index+1} de ${names.length}…`;
          const r=await fetch(url,{cache:"no-store",mode:"cors"});
          if(!r.ok) throw new Error(`HTTP ${r.status}`);
          const txt=(await r.text()).replace(/\s+/g,"");
          if(!txt) throw new Error("archivo vacío");
          return txt;
        }catch(err){
          ultimoError=err;
          console.warn("No se pudo cargar",url,err);
        }
      }
      throw new Error(`${name}: no se pudo descargar desde GitHub Pages ni desde GitHub (${ultimoError?.message||ultimoError})`);
    }

    for(let i=0;i<names.length;i++){
      const b64=await descargarBloque(names[i],i);
      let bin;
      try{bin=atob(b64);}catch(e){throw new Error(`${names[i]}: contenido Base64 inválido`);}
      const bytes=new Uint8Array(bin.length);
      for(let j=0;j<bin.length;j++) bytes[j]=bin.charCodeAt(j);
      chunks.push(bytes);
      total+=bytes.length;
    }

    const gzip=new Uint8Array(total);
    let offset=0;
    for(const chunk of chunks){gzip.set(chunk,offset);offset+=chunk.length;}

    if(gzip[0]!==0x1f || gzip[1]!==0x8b){
      throw new Error("El paquete descargado no tiene una cabecera GZIP válida.");
    }
    if(typeof DecompressionStream!=="function"){
      throw new Error("Este navegador no admite la descompresión necesaria. Actualiza Chrome, Safari, Edge o Firefox.");
    }

    detalle.textContent="Abriendo aplicación…";
    const stream=new Blob([gzip]).stream().pipeThrough(new DecompressionStream("gzip"));
    const html=await new Response(stream).text();

    if(!html.includes("<!DOCTYPE html>") && !html.includes("<!doctype html>")){
      throw new Error("El contenido reconstruido no parece ser un documento HTML válido.");
    }
    if(!html.includes("Arma la salida")){
      throw new Error("La aplicación reconstruida no superó la comprobación de integridad.");
    }

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML=`<main><h1>No se pudo cargar la aplicación</h1><p>${String(err.message||err)}</p><p class="detalle">Prueba una recarga completa con Cmd+Shift+R. Si persiste, envíame esta pantalla.</p></main>`;
    console.error(err);
  }
})();
</script>
</body>
</html>
